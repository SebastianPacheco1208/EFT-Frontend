<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pixel Vault, tienda demo de videojuegos para PC y consolas.">
  <meta name="theme-color" content="#101018">
  <title>Pixel Vault | Tienda de videojuegos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="root">
    <div class="loading-screen" role="status" aria-live="polite">Cargando Pixel Vault…</div>
  </div>

  <!-- Bibliotecas externas por CDN: se requiere conexión a internet. -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  async function cargarBabel(ruta) {
    const respuesta = await fetch(ruta);
    const codigoFuente = await respuesta.text();
    const { code } = Babel.transform(codigoFuente, {
      presets: [["react", { runtime: "classic" }], "env"]
    });
    const script = document.createElement("script");
    script.textContent = code;
    document.body.appendChild(script);
  }

  (async () => {
    await cargarBabel("js/videojuegos.js");
    await cargarBabel("js/app.js");
  })();
</script>
</body>
</html>
